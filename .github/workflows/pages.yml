name: pages

# Publishes site/ to GitHub Pages when a push to main changes it.
# The site is plain HTML and CSS. There is no build step.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the figures against the engine findings
        run: python3 tools/check_figures.py
      - name: Check that the printed commands exist in the engine help
        run: python3 tools/check_commands.py
      - name: Check the pages in a headless browser
        run: python3 tools/check_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
